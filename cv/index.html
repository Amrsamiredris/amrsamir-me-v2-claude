<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amr Samir - Curriculum Vitae</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --text-main: #ededed;
      --text-muted: #888888;
      --border-color: #333333;
      --accent: #ededed;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Geist', 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .cv-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.subtitle { color: var(--text-muted); margin-bottom: 32px; font-size: 15px; }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--text-main);
      color: var(--bg-primary);
      padding: 14px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .btn:hover { background: #fff; transform: translateY(-2px); }
    
    .greeting {
      margin-bottom: 24px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      display: none;
    }
    .greeting span { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

  <div class="cv-card">
    <div class="greeting" id="company-greeting">
      Hello <span id="company-name"></span> team! 👋
    </div>
    
    <h1>Amr Samir's CV</h1>
    <p class="subtitle" id="cv-job-title">Software Engineer & Tech Lead</p>
    
    <a href="/dummy-cv.pdf" download="Amr_Samir_CV.pdf" class="btn" id="download-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Download Resume
    </a>
  </div>

  <!-- Initialize Supabase & Logic -->
  <script type="module">
    import { supabase } from '../src/supabaseClient.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const company = urlParams.get('ref') || 'Anonymous Recruiter';
      const customTitle = urlParams.get('title');
      
      // Update UI greeting and title
      if (company !== 'Anonymous Recruiter') {
        document.getElementById('company-name').textContent = company;
        document.getElementById('company-greeting').style.display = 'block';
      }
      if (customTitle) {
        document.getElementById('cv-job-title').textContent = customTitle;
      }

      // Log the View
      await supabase.from('cv_events').insert([
        { company_name: company, event_type: 'view' }
      ]);

      // Handle Download Click
      document.getElementById('download-btn').addEventListener('click', async () => {
        await supabase.from('cv_events').insert([
          { company_name: company, event_type: 'download' }
        ]);
        // Let the native HTML 'download' attribute handle the actual file download
      });
    });
  </script>
</body>
</html>
